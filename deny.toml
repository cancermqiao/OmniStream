[graph]
# Audit only default feature sets. Enabling all features pulls in optional
# desktop GTK3 dependency chains that are not used in our production path.
all-features = false

[advisories]
yanked = "warn"
# Specific upstream advisories without a compatible fix. Keep vulnerability
# checks enabled; review these exceptions when the upstream dependencies change.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono has no patched release; biliup, m3u8-rs and dioxus-server require it, and existing recording filenames/upload title templates use its strftime formatting." },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is required by biliup -> serde_yaml 0.9; this is an unmaintained notice with no maintained compatible release." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "MPL-2.0", "OpenSSL"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
